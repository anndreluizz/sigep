name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Banco, telas, totem e folha SEMED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
        working-directory: supabase
      - run: npm test
        working-directory: supabase
